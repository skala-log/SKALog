services:
  db:
    image: postgres:17-alpine
    container_name: skalog-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-skalog}
      POSTGRES_USER: ${POSTGRES_USER:-skalog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skalog}
    ports:
      - "5432:5432"
    volumes:
      - skalog-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-skalog}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  skalog-db-data:
